services:
  account-service-postgresql:
    image: postgres:18.6
    container_name: account-service-postgresql
    restart: no
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: account-service-db
    ports:
      - "5432:5432"
    volumes:
      - account_service_postgres_data:/var/lib/postgresql

  user-service-postgresql:
    image: postgres:18.6
    container_name: user-service-postgresql
    restart: no
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: account-service-db
    ports:
      - "5433:5432"
    volumes:
      - user_service_postgres_data:/var/lib/postgresql

volumes:
  account_service_postgres_data:
  user_service_postgres_data:
